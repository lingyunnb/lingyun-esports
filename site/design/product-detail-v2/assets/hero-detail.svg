<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 219" width="390" height="219">
<rect width="390" height="219" fill="#0B1220"/>
<!-- 左：护航服务流程三步（纯几何 + 实色块） -->
<g font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif">
  <text x="22" y="46" fill="#FFFFFF" font-size="17" font-weight="800">护航服务流程</text>
  <text x="22" y="68" fill="rgba(255,255,255,.62)" font-size="11">示意 · 非实拍画面</text>

  <rect x="22" y="88" width="26" height="26" rx="6" fill="rgba(255,255,255,.10)"
        stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>
  <text x="35" y="106" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <text x="58" y="99" fill="#FFFFFF" font-size="13.5" font-weight="700">下单</text>
  <text x="58" y="114" fill="rgba(255,255,255,.62)" font-size="10.5">选好分区与游戏 ID</text>

  <rect x="22" y="127" width="26" height="26" rx="6" fill="rgba(255,255,255,.10)"
        stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>
  <text x="35" y="145" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <text x="58" y="138" fill="#FFFFFF" font-size="13.5" font-weight="700">护航员上号</text>
  <text x="58" y="153" fill="rgba(255,255,255,.62)" font-size="10.5">平台护航员接单后开工</text>

  <rect x="22" y="166" width="26" height="26" rx="6" fill="rgba(255,255,255,.10)"
        stroke="rgba(255,255,255,.28)" stroke-width="1.2"/>
  <text x="35" y="184" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <text x="58" y="177" fill="#FFFFFF" font-size="13.5" font-weight="700">打完结算</text>
  <text x="58" y="192" fill="rgba(255,255,255,.62)" font-size="10.5">确认完成才结算给护航员</text>

  <!-- 右：garland 区域用图形表达"托管结算" -->
  <rect x="248" y="42" width="120" height="135" rx="10" fill="none"
        stroke="rgba(255,255,255,.20)" stroke-width="1.2"/>
  <g stroke="rgba(255,255,255,.55)" stroke-width="1.6" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M308,66 L338,76 L338,99 C338,116 325,128 308,134 C291,128 278,116 278,99 L278,76 Z"/>
    <path d="M297,100 L305,108 L321,90"/>
  </g>
  <text x="308" y="156" fill="rgba(255,255,255,.78)" font-size="10.5"
        text-anchor="middle">积分托管 · 完成才结算</text>
</g>
</svg>
